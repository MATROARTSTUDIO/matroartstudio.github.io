backend:
  name: git-gateway
  branch: main
media_folder: "images2"
public_folder: "images2"
collections:
  - name: "events"
    label: "Events"
    files:
      - name: "events"
        label: "Events List"
        file: "data/events.json"
        fields:
          - label: "Events"
            name: "events"
            widget: "list"
            summary: "{{fields.title}} — {{fields.ministry}}"
            fields:
              - { label: "Event Title", name: "title", widget: "string" }
              - { label: "Ministry / Organisation", name: "ministry", widget: "string" }
              - { label: "Venue", name: "venue", widget: "string" }
              - { label: "Badge (year or tag)", name: "badge", widget: "string", default: "2026" }
              - label: "Photos"
                name: "photos"
                widget: "list"
                summary: "{{fields.photo}}"
                field: { label: "Photo", name: "photo", widget: "image" }

  - name: "gallery"
    label: "Gallery Page"
    files:
      - name: "gallery"
        label: "Gallery Content"
        file: "data/gallery.json"
        fields:
          - label: "Top Slider"
            name: "slider"
            widget: "list"
            summary: "{{fields.caption}}"
            fields:
              - label: "Photo"
                name: "src"
                widget: "image"
                media_folder: "/images"
                public_folder: "images"
              - { label: "Alt text", name: "alt", widget: "string", required: false }
              - { label: "Caption", name: "caption", widget: "string", required: false }
          - label: "Photo Grid"
            name: "grid"
            widget: "list"
            summary: "{{fields.alt}}"
            fields:
              - label: "Photo"
                name: "src"
                widget: "image"
                media_folder: "/gallery-images"
                public_folder: "gallery-images"
              - { label: "Alt text", name: "alt", widget: "string", required: false }

  - name: "about"
    label: "About Page"
    files:
      - name: "about"
        label: "About Content"
        file: "data/about.json"
        fields:
          - label: "Story Photo"
            name: "photo"
            widget: "image"
            media_folder: "/images"
            public_folder: "images"
          - { label: "Photo caption (e.g. 📍 Lajpat Nagar, New Delhi)", name: "imageCaption", widget: "string", required: false }
          - { label: "Eyebrow label (top of banner)", name: "label", widget: "string", default: "Who We Are" }
          - { label: "Banner title (HTML, e.g. Our <em>Story</em>)", name: "titleHtml", widget: "string", default: "Our <em>Story</em>" }
          - { label: "Section label (e.g. Since 2008)", name: "sectionLabel", widget: "string", default: "Since 2008" }
          - { label: "Heading (HTML — <br> and <em> allowed)", name: "headingHtml", widget: "text" }
          - label: "Story Paragraphs"
            name: "paragraphs"
            widget: "list"
            field: { label: "Paragraph", name: "paragraph", widget: "text" }
          - label: "Timeline"
            name: "timeline"
            widget: "list"
            summary: "{{fields.year}} — {{fields.desc}}"
            fields:
              - { label: "Short label (e.g. 08)", name: "dot", widget: "string" }
              - { label: "Year", name: "year", widget: "string" }
              - { label: "Description", name: "desc", widget: "text" }
          - { label: "Badge number (e.g. 18+)", name: "badgeNumber", widget: "string" }
          - { label: "Badge label (e.g. Years)", name: "badgeLabel", widget: "string" }
